<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>주차 연락 카드 인쇄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* 인쇄용 카드 한 장 (54 x 85.5mm, 신용카드 크기 세로).
   이 페이지를 연 뒤 인쇄 → "PDF로 저장" 하면 카드 크기 PDF 가 나옵니다.
   인쇄 창에서 배율 100%, 여백 없음, "배경 그래픽" 켜기. */
@page { size: 54mm 85.5mm; margin: 0; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px; background: #e9ebee; color: #1b1f24;
  font: 15px/1.5 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.controls {
  width: 100%; max-width: 440px; background: #fff; border: 1px solid #d4d8de; border-radius: 14px;
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
}
.controls label { font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
.controls input {
  font: inherit; padding: 10px 12px; border: 1px solid #d4d8de; border-radius: 8px; background: #e9ebee; width: 100%;
}
.controls button {
  cursor: pointer; border: 0; border-radius: 10px; padding: 14px;
  background: #1b1f24; color: #fff; font: 20px/1 "Do Hyeon", sans-serif;
}
.warn { font-size: 13px; color: #c8321e; margin: 0; }
.hint { font-size: 13px; color: #5c6470; margin: 0; }
[hidden] { display: none !important; }

.card {
  width: 54mm; height: 85.5mm; background: #fff; color: #1b1f24;
  border-radius: 3mm; overflow: hidden; position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 6.5mm 4mm 4mm; gap: 2mm; text-align: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4mm;
  background: repeating-linear-gradient(-45deg, #f2b705 0 3mm, #1b1f24 3mm 6mm);
}
.card h1 { font: 7.2mm/1.1 "Do Hyeon", sans-serif; margin: 0; }
.card .sub { font-size: 2.9mm; line-height: 1.35; margin: 0; }
.card .qr { width: 38mm; height: 38mm; }
.card .qr svg { width: 100%; height: 100%; display: block; }
.card .platenum {
  font: 6mm/1 "Do Hyeon", sans-serif; letter-spacing: .04em;
  border: .5mm solid #1b1f24; border-radius: 1.2mm; padding: 1.2mm 2.4mm;
}
.card .foot { font-size: 2.5mm; color: #5c6470; margin: auto 0 0; }

@media print {
  body { padding: 0; background: #fff; display: block; }
  .controls { display: none; }
  .card { border-radius: 0; box-shadow: none; }
}
</style>
</head>
<body>
<section class="controls">
  <label for="url">QR 에 담을 주소
    <input id="url" type="url" inputmode="url" spellcheck="false">
  </label>
  <label for="plate">차량 번호
    <input id="plate" type="text" value="36마 4789">
  </label>
  <p class="warn" id="warn" hidden>이 주소는 내 컴퓨터에서만 열립니다. 호스팅에 올린 뒤의 실제 주소(https://…/?c=car1)로 바꿔서 인쇄하세요.</p>
  <button type="button" onclick="window.print()">인쇄 / PDF 저장</button>
  <p class="hint">인쇄 창에서 배율 100% · 여백 없음 · 배경 그래픽 켜기</p>
</section>

<article class="card">
  <h1>주차 연락</h1>
  <p class="sub">QR 을 찍으면 차주에게<br>바로 알림이 갑니다</p>
  <div class="qr" id="qr"></div>
  <div class="platenum" id="plateOut"></div>
  <p class="foot">전화번호 없이 연락 · 앱 설치 불필요</p>
</article>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  // 호스팅된 주소에서 이 페이지를 열면 같은 폴더의 index.html 주소가 자동으로 들어감
  $("url").value = new URL("./?c=car1", location.href).href;

  function render() {
    const url = $("url").value.trim();
    $("warn").hidden = /^https:\/\//.test(url) && !/\/\/(localhost|127\.0\.0\.1)/.test(url);
    $("plateOut").textContent = $("plate").value.trim();
    $("plateOut").hidden = !$("plate").value.trim();
    if (!url) { $("qr").innerHTML = ""; return; }
    const qr = qrcode(0, "Q");   // 오류 복원 Q(25%): 앞유리 반사·긁힘 대비
    qr.addData(url); qr.make();
    $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }
  $("url").addEventListener("input", render);
  $("plate").addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
